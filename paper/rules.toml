# Paper-trading rules. `uv run investotron paper` tracks these.
#
# Each rule: trade `direction` at the first open after any 8-K containing `item`,
# and hold for `horizon` trading sessions. P&L is hedged against the benchmark using
# the stock's trailing beta, so it measures the stock relative to the market.
#
# The first run after you add a rule records it in rules.lock.json with the current
# time. Only filings after that count as live. Commit the lock file: it's the
# proof of when each rule started. Editing a rule that has started is refused --
# copy it under a new name instead.
#
# Settings: name, item (8-K item code), direction (long/short), horizon (sessions),
# surprise (optional, item 2.02 only: "miss", "in line" or "beat").

universe = "../universes/starter.txt"  # relative to this file
benchmark = "SPY"

# The one event-study row that survived beta adjustment and clustering:
# -4.9% over 20 sessions after "agreement terminated" filings (n=48, t=-2.3).
# It was also 1 of 45 rows tested, so this is the rule most likely to disappoint.
[[rule]]
name = "short-agreement-terminated"
item = "1.02"
direction = "short"
horizon = 20

# Control: earnings beats jumped +1.9% overnight but showed no drift after the
# open. Expect roughly zero here. If it isn't, something is off.
[[rule]]
name = "long-earnings-beat"
item = "2.02"
surprise = "beat"
direction = "long"
horizon = 5
